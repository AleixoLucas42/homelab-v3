apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cardsgo-route
  namespace: traefik-gateway
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: traefik-gateway
    namespace: traefik-gateway
    sectionName: websecure
  hostnames:
    - "cardsgo.ddns.net"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: ExtensionRef
      extensionRef:
        group: traefik.io
        kind: Middleware
        name: crowdsec-bouncer
    backendRefs:
    - name: cardsgo-svc
      namespace: cardsgo
      port: 80
---
