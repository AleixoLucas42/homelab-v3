container_runtime: containerd
agent:
  metrics:
    enabled: true
  enabled: true
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/base-http-scenarios crowdsecurity/http-cve"
  config: {}
  acquisition:
    - namespace: traefik-gateway
      podName: traefik-*
      program: traefik

appsec:
  metrics:
    enabled: true
  enabled: true
  acquisitions:
    - source: appsec
      listen_addr: "0.0.0.0:7422"
      path: /
      appsec_configs:
        - crowdsecurity/appsec-default
        - crowdsecurity/crs
      labels:
        type: appsec
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-crs crowdsecurity/appsec-generic-rules crowdsecurity/base-http-scenarios crowdsecurity/http-cve"

lapi:
  metrics:
    enabled: true
  replicas: 1
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/base-http-scenarios crowdsecurity/http-cve"
    - name: ENROLL_INSTANCE_NAME
      value: 'k8s-aleixohome'
    - name: ENROLL_TAGS
      value: 'k8s homelab'
    - name: BOUNCER_KEY_traefik
      valueFrom:
        secretKeyRef:
          name: crowdsec-keys
          key: BOUNCER_KEY_traefik
  persistentVolume:
    config:
      enabled: true
    data:
      enabled: true
