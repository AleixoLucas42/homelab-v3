main:
  config:
    generic:
      timezone: "America/Sao_Paulo"
    webhook:
      url: "https://n8n.aleixolab.ddns.net"
  livenessProbe:
    initialDelaySeconds: 120
  readinessProbe:
    initialDelaySeconds: 120

  secret:
    n8n:
      encryption_key: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

  service:
    type: ClusterIP
    port: 80

image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  tag: "2.23.1"

persistence:
  enabled: true
  type: dynamic
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  size: 3Gi

ingress:
  enabled: false

resources:
  requests:
    memory: "384Mi"
    cpu: "500m"
  limits:
    memory: "512Mi"
    cpu: "900m"
