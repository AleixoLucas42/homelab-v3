apiVersion: v1
kind: Service
metadata:
  name: adguardhome-svc
  namespace: adguard
spec:
  type: LoadBalancer
  loadBalancerIP: 10.11.50.201
  externalTrafficPolicy: Local
  selector:
    app: adguardhome
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: http
      port: 80
      targetPort: 80

