minecraftServer:
  eula: true
  version: "26.3"
  difficulty: "hard"
  maxPlayers: 5
  pvp: false
  memory: "2048M"
  serviceType: LoadBalancer
  rcon:
    enabled: true
    withGeneratedPassword: false
    existingSecret: minecraft-rcon-sec
    secretKey: rcon-password

extraEnv:
  ENABLE_WHITELIST: "true"
  WHITELIST: "LucasAleixo,S4r3c0,Dinotsu"
  SERVER_NAME: "homelab-minecraft-server"
  ENABLE_AUTOSTOP: "true"
  AUTOSTOP_TIMEOUT_INIT: "60"
  AUTOSTOP_TIMEOUT_EST: "60"
  AUTOSTOP_PERIOD: "7200"
  TZ: "America/Sao_Paulo"
  VIEW_DISTANCE: "8"
  SIMULATION_DISTANCE: "4"

tty: true
stdin: true

resources:
  requests:
    memory: "2Gi"
    cpu: "500m"
  limits:
    memory: "4Gi"
    cpu: "2"

persistence:
  dataDir:
    enabled: true
    storageClass: "local-path"
    Size: 10Gi

podSecurityContext:
  fsGroup: 3000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  runAsUser: 1000
  runAsGroup: 3000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
replicaCount: 1
