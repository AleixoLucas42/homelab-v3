minecraftServer:
  eula: true
  version: "26.3"
  difficulty: "hard"
  maxPlayers: 5
  pvp: false
  memory: "1536M"
  serviceType: LoadBalancer

extraEnv:
  ENABLE_WHITELIST: "true"
  WHITELIST: "LucasAleixo"
  SERVER_NAME: "homelab-minecraft-server"
  ENABLE_AUTOSTOP: "true"
  AUTOSTOP_TIMEOUT_INIT: "60"
  AUTOSTOP_TIMEOUT_EST: "60"
  AUTOSTOP_PERIOD: "7200"
  TZ: "America/Sao_Paulo"
  VIEW_DISTANCE: "6"
  SIMULATION_DISTANCE: "4"

tty: true
stdin: true

resources:
  requests:
    memory: "2096Mi"
  limits:
    memory: "2096Mi"

persistence:
  dataDir:
    enabled: true
    storageClass: "local-path"
    Size: 10Gi

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID

replicaCount: 1
