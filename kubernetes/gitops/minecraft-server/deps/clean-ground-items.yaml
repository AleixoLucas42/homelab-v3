---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minecraft-clean-ground-items
  namespace: minecraft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minecraft-clean-ground-items
  namespace: minecraft
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minecraft-clean-ground-items
  namespace: minecraft
subjects:
  - kind: ServiceAccount
    name: minecraft-clean-ground-items
    namespace: minecraft
roleRef:
  kind: Role
  name: minecraft-clean-ground-items
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-clean-ground-items
  namespace: minecraft
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: minecraft-clean-ground-items
          restartPolicy: Never
          containers:
            - name: clean-ground-items
              image: alpine/k8s:1.35.5
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  log() {
                    printf '%s %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$*"
                  }

                  log "Starting ground-item cleanup sequence."
                  if ! kubectl wait --namespace minecraft --for=condition=Ready pod -l app=minecraft --timeout=30s; then
                    log "Minecraft pod is not ready; skipping ground-item cleanup."
                    exit 0
                  fi

                  minecraft_pod="$(kubectl get pods --namespace minecraft -l app=minecraft -o jsonpath='{.items[0].metadata.name}')"
                  if [ -z "$minecraft_pod" ]; then
                    log "Minecraft pod was not found."
                    exit 1
                  fi
                  log "Using Minecraft pod: $minecraft_pod."

                  rcon() {
                    kubectl exec --namespace minecraft "$minecraft_pod" -- rcon-cli "$@"
                  }

                  if ! players_output="$(rcon list)"; then
                    log "Could not query online players; skipping ground-item cleanup."
                    exit 1
                  fi
                  printf '%s\n' "$players_output"
                  players_online="$(printf '%s\n' "$players_output" | sed -n 's/^There are \([0-9][0-9]*\) of a max.*/\1/p')"
                  if [ "$players_online" = "0" ]; then
                    log "No players are online; skipping ground-item cleanup."
                    exit 0
                  fi
                  if [ -z "$players_online" ]; then
                    log "Could not parse online player count; skipping ground-item cleanup."
                    exit 1
                  fi
                  log "$players_online player(s) online; starting warning countdown."

                  for minutes in 5 4 3 2; do
                    message="$(printf '{"text":"[server] Cleaning ground items in %s minutes","color":"light_purple"}' "$minutes")"
                    rcon /tellraw @a "$message"
                    log "Sent cleanup warning for $minutes minutes; waiting 60 seconds."
                    sleep 60
                  done

                  rcon /tellraw @a '{"text":"[server] Cleaning ground items in 1 minute","color":"red"}'
                  log "Sent one-minute warning; waiting 60 seconds."
                  sleep 60

                  log "Starting final five-second countdown."
                  for seconds in 5 4 3 2 1; do
                    message="$(printf '{"text":"[server] Cleaning ground items in %s seconds","color":"light_purple"}' "$seconds")"
                    rcon /tellraw @a "$message"
                    log "Sent cleanup warning for $seconds seconds."
                    sleep 1
                  done

                  rcon /tellraw @a '{"text":"[server] Cleaning ground items","color":"dark_red"}'
                  log "Removing dropped items with /kill @e[type=item]."
                  kill_output="$(rcon /kill '@e[type=item]')"
                  printf '%s\n' "$kill_output"
                  items_cleaned="$(printf '%s\n' "$kill_output" | awk '$1 == "Killed" && $2 ~ /^[0-9]+$/ { print $2; exit }')"
                  if [ -n "$items_cleaned" ]; then
                    log "Removed $items_cleaned dropped items."
                    message="$(printf '{"text":"[server] Ground items cleaned: %s","color":"green"}' "$items_cleaned")"
                  elif printf '%s\n' "$kill_output" | grep -Eiq 'No entit(y|ies) (was|were) found'; then
                    log "No dropped items were present."
                    message='{"text":"[server] No ground items were present.","color":"green"}'
                  else
                    log "Could not parse item count from RCON response: $kill_output"
                    message='{"text":"[server] Ground items cleaned.","color":"green"}'
                  fi
                  rcon /tellraw @a "$message"
                  log "Ground-item cleanup completed successfully."
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi