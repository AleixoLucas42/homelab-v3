env:
  TZ: America/Sao_Paulo
  PUID: "1000"
  PGID: "1000"
  COMPlus_EnableDiagnostics: "0"
  SENTRY_DSN: ""
  SENTRY_ENABLED: "false"

persistence:
  config:
    enabled: true
    type: hostPath
    hostPath: /mnt/data/config/radarr
    mountPath: /config
  media:
    enabled: true
    type: hostPath
    hostPath: /mnt/data
    mountPath: /data

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"
