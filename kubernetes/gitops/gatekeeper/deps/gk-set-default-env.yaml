apiVersion: mutations.gatekeeper.sh/v1
kind: Assign
metadata:
  name: gk-set-set-dotnet-env-default
spec:
  applyTo:
  - groups: ["apps"]
    kinds: ["Deployment"]
    versions: ["v1"]
  match:
    scope: Namespaced
    kinds:
    - apiGroups: ["*"]
      kinds: ["Deployment"]
    namespaces: ["cardsgo"]
  location: "spec.template.spec.containers[name:*].env[name:TZ]"
  parameters:
    assign:
      value:
        name: TZ
        value: "America/Sao_Paulo"
