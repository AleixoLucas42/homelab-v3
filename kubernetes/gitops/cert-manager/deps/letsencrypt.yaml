apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: aleixo2lucas@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: traefik-gateway
            namespace: traefik-gateway
            kind: Gateway
            sectionName: websecure
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-cert
  namespace: traefik-gateway 
spec:
  secretName: aleixolab-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - "aleixolab.ddns.net"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cardsgo-cert
  namespace: traefik-gateway 
spec:
  secretName: cardsgo-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - "cardsgo.ddns.net"
