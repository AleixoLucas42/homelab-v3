apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-unseal-sa
  namespace: hashicorp-vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-unseal-role
  namespace: hashicorp-vault
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-unseal-binding
  namespace: hashicorp-vault
subjects:
  - kind: ServiceAccount
    name: vault-unseal-sa
    namespace: hashicorp-vault
roleRef:
  kind: Role
  name: vault-unseal-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-unseal
  namespace: hashicorp-vault
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault-unseal-sa
          restartPolicy: OnFailure
          containers:
            - name: vault-unseal
              imagePullPolicy: IfNotPresent
              image: alpine/k8s:1.33.13
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  cd /app/backups
                  
                  echo "Extraindo chaves do backup..."
                  KEY1=$(jq -r '.["kv/aleixohome/kubernetes/vault"].keys_base64[0]' vault-backup.json)
                  KEY2=$(jq -r '.["kv/aleixohome/kubernetes/vault"].keys_base64[1]' vault-backup.json)
                  KEY3=$(jq -r '.["kv/aleixohome/kubernetes/vault"].keys_base64[2]' vault-backup.json)
                  
                  VAULT_PODS=$(kubectl get pods -n hashicorp-vault --no-headers | awk '/^vault-[0-9]+/ {print $1}')
                  
                  for POD in $VAULT_PODS; do
                    echo "Verificando status do $POD..."
                    
                    STATUS=$(kubectl exec -n hashicorp-vault $POD -- vault status -format=json 2>/dev/null || true)
                    SEALED=$(echo "$STATUS" | jq -r '.sealed' 2>/dev/null || echo "unknown")
                    
                    if [ "$SEALED" = "true" ]; then
                      echo "Pod $POD está selado. Iniciando processo de unseal..."
                      kubectl exec -n hashicorp-vault $POD -- vault operator unseal $KEY1 > /dev/null
                      kubectl exec -n hashicorp-vault $POD -- vault operator unseal $KEY2 > /dev/null
                      kubectl exec -n hashicorp-vault $POD -- vault operator unseal $KEY3 > /dev/null
                      echo "Pod $POD desbloqueado com sucesso!"
                    elif [ "$SEALED" = "false" ]; then
                      echo "Pod $POD já está desbloqueado. Nenhuma ação necessária."
                    else
                      echo "Não foi possível determinar o status do $POD (pode estar iniciando)."
                    fi
                  done
              volumeMounts:
                - name: backup-storage
                  mountPath: /app/backups
          volumes:
            - name: backup-storage
              hostPath:
                path: /mnt/vault-backups
                type: DirectoryOrCreate
