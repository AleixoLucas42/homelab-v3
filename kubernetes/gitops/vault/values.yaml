global:
  enabled: true
  tlsDisable: true

server:
  enabled: true
  image:
    repository: "hashicorp/vault"
    tag: "2.0.1"
    pullPolicy: IfNotPresent
  statefulSet:
    annotations: {}

    securityContext:
      pod: {}
      container:
        capabilities:
          add:
            - IPC_LOCK
  ui:
    enabled: true
    serviceType: "ClusterIP"
    serviceNodePort: null
    externalPort: 8200

  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: "local-path"
    accessMode: ReadWriteOnce
    mountPath: "/vault/data"

  config: |
    ui = true

    listener "tcp" {
      tls_disable = 1
      address     = "[::]:8200"
      cluster_address = "[::]:8201"
    }

    storage "file" {
      path = "/vault/data"
    }

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "300m"

ingress:
  enabled: false

injector:
  enabled: false
