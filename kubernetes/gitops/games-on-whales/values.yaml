steam:
  enabled: false
firefox:
  enabled: false

retroarch:
  enabled: true
  resources:
    limits:
      cpu: "1"
      memory: "512Mi"
      nvidia.com/gpu: "0"
    requests:
      cpu: "100m"
      memory: "128Mi"
      nvidia.com/gpu: "0"
  volumeMounts:
    - name: roms
      mountPath: /home/retro/ROMs

xorg:
  resolution: "1920x1080"
  refreshrate: 60
  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
      nvidia.com/gpu: "0"
    requests:
      cpu: "100m"
      memory: "128Mi"
      nvidia.com/gpu: "0"

sunshine:
  enabled: true
  resources:
    limits:
      cpu: "1"
      memory: "512Mi"
      nvidia.com/gpu: "1"
    requests:
      cpu: "100m"
      memory: "256Mi"
      nvidia.com/gpu: "1"
  user: ""
  password: ""
  logLevel: "info"
  env:
    SUNSHINE_USER:
      valueFrom:
        secretKeyRef:
          name: games-on-whales-sec
          key: user
    SUNSHINE_PASS:
      valueFrom:
        secretKeyRef:
          name: games-on-whales-sec
          key: password

persistence:
  home:
    enabled: true
    type: pvc
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: "local-path"

  config:
    enabled: true
    type: pvc
    accessMode: ReadWriteOnce
    size: 256Mi
    storageClass: "local-path"
  
  roms:
    enabled: true
    type: pvc
    accessMode: ReadWriteOnce
    size: 20Gi 
    mountPath: /home/retro/ROMs
    storageClass: "local-path"

service:
  main:
    type: LoadBalancer
  udp:
    type: LoadBalancer
