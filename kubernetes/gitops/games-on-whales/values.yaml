
steam:
  enabled: false
firefox:
  enabled: false


retroarch:
  enabled: true

graphic_resources:
  nvidia.com/gpu: 1

xorg:
  resolution: "1920x1080"
  refreshrate: 60

sunshine:
  user: ""
  password: ""
  logLevel: "info"
  env:
    SUNSHINE_USER:
      valueFrom:
        secretKeyRef:
          name: games-on-whales-sec
          key: user
    SUNSHINE_PASS:
      valueFrom:
        secretKeyRef:
          name: games-on-whales-sec
          key: password

persistence:
  config:
    enabled: true
    type: pvc
    accessMode: ReadWriteOnce
    size: 3Gi
    storageClass: "local-path"
  
  roms:
    enabled: true
    type: pvc
    accessMode: ReadWriteOnce
    size: 20Gi 
    mountPath: /home/retro/ROMs
    storageClass: "local-path"

service:
  main:
    type: LoadBalancer
  udp:
    type: LoadBalancer

tolerations:
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"