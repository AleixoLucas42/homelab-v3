apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
spec:
  project: internal-lab

  sources:
    - repoURL: https://open-policy-agent.github.io/gatekeeper/charts
      chart: gatekeeper
      targetRevision: 3.20.1
      helm:
        valueFiles:
          - $values/kubernetes/gitops/gatekeeper/values.yaml

    - repoURL: git@github.com:AleixoLucas42/homelab-v3.git
      targetRevision: main
      ref: values

    - repoURL: git@github.com:AleixoLucas42/homelab-v3.git
      targetRevision: main
      path: kubernetes/gitops/gatekeeper/deps/

  destination:
    name: in-cluster
    namespace: gatekeeper-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: configs.config.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: assign.mutations.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: assignimage.mutations.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: assignmetadata.mutations.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: configpodstatuses.status.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: connectionpodstatuses.status.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: connections.connection.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: constraintpodstatuses.status.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: constrainttemplatepodstatuses.status.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: constrainttemplates.templates.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: expansiontemplate.expansion.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: expansiontemplatepodstatuses.status.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: modifyset.mutations.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: mutatorpodstatuses.status.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: providers.externaldata.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: syncsets.syncset.gatekeeper.sh
      jsonPointers:
        - /spec/preserveUnknownFields
