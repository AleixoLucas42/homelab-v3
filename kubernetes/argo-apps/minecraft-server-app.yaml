apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minecraft
  namespace: argocd
spec:
  project: internal-lab

  sources:
    - repoURL: 'https://itzg.github.io/minecraft-server-charts/'
      targetRevision: 5.1.3
      chart: minecraft
      helm:
        releaseName: minecraft
        valueFiles:
          - $values/kubernetes/gitops/minecraft-server/values.yaml

    - repoURL: git@github.com:AleixoLucas42/homelab-v3.git
      targetRevision: main
      ref: values

  destination:
    name: in-cluster
    namespace: minecraft

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
