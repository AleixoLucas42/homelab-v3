apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarr
  namespace: argocd
spec:
  project: internal-lab
  sources:
    - repoURL: 'https://k8s-home-lab.github.io/helm-charts/'
      targetRevision: 17.3.1
      chart: sonarr
      helm:
        releaseName: sonarr
        valueFiles:
          - $values/kubernetes/gitops/sonarr/values.yaml

    - repoURL: 'git@github.com:AleixoLucas42/homelab-v3.git'
      targetRevision: main
      ref: values

  destination:
    name: in-cluster
    namespace: sonarr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
