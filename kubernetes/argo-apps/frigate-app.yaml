apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frigate
  namespace: argocd
spec:
  project: internal-lab

  sources:
    - repoURL: 'https://blakeblackshear.github.io/blakeshome-charts/'
      targetRevision: 7.8.0
      chart: frigate
      helm:
        releaseName: frigate
        valueFiles:
          - $values/kubernetes/gitops/frigate/values.yaml

    - repoURL: 'git@github.com:AleixoLucas42/homelab-v3.git'
      targetRevision: main
      ref: values

  destination:
    name: in-cluster
    namespace: frigate

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
