apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: internal-lab
  sources:
    - repoURL: 'https://jellyfin.github.io/jellyfin-helm'
      targetRevision: 3.2.0
      chart: jellyfin
      helm:
        releaseName: jellyfin
        valueFiles:
          - $values/kubernetes/gitops/jellyfin/values.yaml

    - repoURL: 'git@github.com:AleixoLucas42/homelab-v3.git'
      targetRevision: main

      ref: values
  destination:
    name: in-cluster
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
