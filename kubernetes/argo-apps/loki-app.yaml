apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
spec:
  project: internal-lab
  sources:
    - repoURL: 'https://grafana.github.io/helm-charts'
      targetRevision: 2.10.2
      chart: loki-stack
      helm:
        releaseName: loki-stack
        valueFiles:
          - $values/kubernetes/gitops/loki/values.yaml

    - repoURL: 'git@github.com:AleixoLucas42/homelab-v3.git'
      targetRevision: main
      ref: values

  destination:
    name: in-cluster
    namespace: loki

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
