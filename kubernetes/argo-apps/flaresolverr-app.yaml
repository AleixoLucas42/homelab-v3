apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flaresolverr
  namespace: argocd
spec:
  project: internal-lab
  sources:
    - repoURL: 'https://k8s-home-lab.github.io/helm-charts/'
      targetRevision: 6.2.0
      chart: flaresolverr
      helm:
        releaseName: flaresolverr
        valueFiles:
          - $values/kubernetes/gitops/flaresolverr/values.yaml

    - repoURL: 'git@github.com:AleixoLucas42/homelab-v3.git'
      targetRevision: main
      ref: values

  destination:
    name: in-cluster
    namespace: flaresolverr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
